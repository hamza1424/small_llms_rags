# RAG Configuration
knowledge_base:
  folder: "dataset"
  chunk_size: 500
  chunk_overlap: 50

retrieval:
  top_k: 3
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

vector_store:
  path: "./chroma_db"
  collection_name: "medical_knowledge_minilmv2"

ollama:
  base_url: "http://localhost:11434"
  models:
    - "medaibase/medgemma1.5:4b"
    - "gemma3:12b"
    - "llama3.1:8b"
    - "qwen3:4b"
    - "granite4.1:8b"

gold_data:
  folder: "data"
  csv_file: "gold_data.csv"
  default_focus_area: "Diabetes"

bertscore:
  model: "roberta-base"
  batch_size: 8
